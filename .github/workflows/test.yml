name: Check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - name: Validate live triage collector
        if: runner.os == 'Linux'
        run: |
          /bin/sh -n scripts/netscaler_kernel_triage.sh
          /bin/sh scripts/netscaler_kernel_triage.sh --self-test
